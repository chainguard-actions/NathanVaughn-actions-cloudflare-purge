name: Test credentials via environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with credentials from environment variables
        id: action
        env:
          IS_TESTING: "1"
          CLOUDFLARE_ZONE: "env-zone-id-99999"
          CLOUDFLARE_AUTH_KEY: "env-auth-key-xyz"
        uses: .
        with:
          files: "https://example.com/style.css https://example.com/app.js"

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error (env-var credentials mode)"
