name: Test missing credentials causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without credentials (should fail)
        id: action
        env:
          IS_TESTING: "1"
        continue-on-error: true
        uses: .
        with:
          urls: "https://example.com/page1"

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when credentials are missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when credentials were missing"
