name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without credentials (should fail)
        id: action
        continue-on-error: true
        env:
          NATHANVAUGHN_TESTING: "1"
        uses: .
        with:
          cf_zone: ""
          cf_auth: ""
      - name: Assert action failed due to missing credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when credentials are missing, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed when credentials were missing"
