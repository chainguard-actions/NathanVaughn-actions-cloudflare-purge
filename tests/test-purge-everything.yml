    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with no specific targets (purge everything)
        id: action
        env:
          NATHANVAUGHN_TESTING: "1"
