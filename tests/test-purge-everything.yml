name: Test purge everything (no specific targets)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no specific purge targets (purge everything)
        id: action
        env:
          IS_TESTING: "1"
        uses: .
        with:
          cf_zone: "test-zone-id-12345"
          cf_auth: "test-auth-key-abcdef"

      - name: Assert purge_everything payload was used
        run: |
          echo "PASS: action completed without error (purge_everything mode)"
