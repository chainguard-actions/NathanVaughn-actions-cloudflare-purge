name: Test missing Cloudflare zone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          CLOUDFLARE_AUTH_KEY: "fake-auth-key"
          # CLOUDFLARE_ZONE is intentionally not set
      - name: Assert action failed due to missing zone
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CLOUDFLARE_ZONE is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CLOUDFLARE_ZONE is missing"
