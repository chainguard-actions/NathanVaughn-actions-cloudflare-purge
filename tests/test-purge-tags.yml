name: Test purge by cache tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with cache tags to purge
        id: action
        env:
          IS_TESTING: "1"
        uses: .
        with:
          cf_zone: "test-zone-id-12345"
          cf_auth: "test-auth-key-abcdef"
          tags: "tag-one tag-two tag-three"

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error (cache-tag purge mode)"
