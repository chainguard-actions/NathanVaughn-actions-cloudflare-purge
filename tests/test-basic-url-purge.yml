name: Test basic URL purge
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IS_TESTING: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Python
        run: python --version
      - id: action
        uses: .
        with:
          cf_zone: "test-zone-id-12345"
          cf_auth: "test-auth-key-abcdef"
          urls: "https://example.com/page1 https://example.com/page2"
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
