name: Test tags hosts and prefixes purge
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IS_TESTING: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Python
        run: python --version
      - id: action
        uses: .
        with:
          cf_zone: "test-zone-id-12345"
          cf_auth: "test-auth-key-abcdef"
          tags: "tag1 tag2"
          hosts: "example.com www.example.com"
          prefixes: "/static /assets"
      - name: Assert action completed successfully with tags/hosts/prefixes
        run: |
          echo "Action completed without error using tags, hosts, and prefixes"
          echo "PASS"
