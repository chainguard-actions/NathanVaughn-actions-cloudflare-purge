name: Test invalid Cloudflare credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          CLOUDFLARE_ZONE: "00000000000000000000000000000000"
          CLOUDFLARE_AUTH_KEY: "invalid-fake-auth-key-for-testing"
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid Cloudflare credentials"
